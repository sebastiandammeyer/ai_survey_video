<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Deltagerkode</title>
<style>
  html, body { margin: 0; padding: 1px; box-sizing: border-box; background: transparent; font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #1f2933; }
  .box { box-sizing: border-box; width: 100%; max-width: 450px; display: flex; align-items: center; gap: 18px; padding: 14px 16px; border: 1px solid #d8dde3; border-radius: 8px; background: #f7f9fb; }
  .code { flex: none; min-width: 84px; padding: 8px 14px; border-radius: 6px; background: #fff; border: 1px solid #c9d1da; text-align: center; font: 700 34px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 4px; color: #0b2545; }
  .txt .h { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
  .txt .s { font-size: 14px; line-height: 1.4; color: #52606d; }
</style>
</head>
<body>
<div class="box">
  <div class="code" id="code"></div>
  <div class="txt">
    <div class="h">Din personlige deltagerkode</div>
    <div class="s">Skriv koden i feltet nedenfor for at fortsætte.</div>
  </div>
</div>
<script>
  // Trækker en tilfældig kode 10-81 (72 koder, deles ligeligt med 3, 6, 9, 12, 18 og 24 grupper = 1, 2, 3, 4, 6 og 8 videoer x 3 likes). Samme kode vises igen, hvis siden genindlæses.
  var KEY = "deltagerkode3";
  var code = null;
  try { code = localStorage.getItem(KEY); } catch (e) {}
  if (!/^([1-7][0-9]|8[01])$/.test(code || "")) {
    var n;
    try {
      var r = new Uint32Array(1);
      (window.crypto || window.msCrypto).getRandomValues(r);
      n = r[0] % 72;
    } catch (e) {
      // Reserve til meget gamle browsere uden crypto
      n = Math.floor(Math.random() * 72);
    }
    code = String(10 + n);
    try { localStorage.setItem(KEY, code); } catch (e) {}
  }
  document.getElementById("code").textContent = code;
</script>
</body>
</html>
