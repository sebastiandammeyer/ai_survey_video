<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Deltagerkode</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #1a1a1a; }
  body { display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; padding: 14px 24px; border: 1px solid #d5d8dc; border-radius: 10px; background: #fff; }
  .lbl { font-size: 14px; color: #555; margin-bottom: 4px; }
  .code { font: 700 38px/1.1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 6px; }
</style>
</head>
<body>
<div class="box">
  <div class="lbl">Din deltagerkode</div>
  <div class="code" id="code"></div>
</div>
<script>
  // Trækker en tilfældig kode 10-81 (72 koder, deles ligeligt med 3, 6, 9, 12, 18 og 24 grupper = 1, 2, 3, 4, 6 og 8 videoer x 3 likes). Samme kode vises igen, hvis siden genindlæses.
  var KEY = "deltagerkode3";
  var code = null;
  try { code = localStorage.getItem(KEY); } catch (e) {}
  if (!/^([1-7][0-9]|8[01])$/.test(code || "")) {
    var n;
    try {
      var r = new Uint32Array(1);
      (window.crypto || window.msCrypto).getRandomValues(r);
      n = r[0] % 72;
    } catch (e) {
      // Reserve til meget gamle browsere uden crypto
      n = Math.floor(Math.random() * 72);
    }
    code = String(10 + n);
    try { localStorage.setItem(KEY, code); } catch (e) {}
  }
  document.getElementById("code").textContent = code;
</script>
</body>
</html>
