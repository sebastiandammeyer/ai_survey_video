<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Feed</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; background: #f0f2f5; font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #050505; }
  .top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 12px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .logo { font: 700 26px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -1px; color: #1877f2; }
  .top .sp { flex: 1; }
  .ic { width: 36px; height: 36px; border-radius: 50%; background: #e4e6eb; display: grid; place-items: center; }
  .ic svg { width: 20px; height: 20px; fill: #050505; }
  .feed { max-width: 500px; margin: 0 auto; padding: 8px 0 16px; }
  .post { background: #fff; margin: 8px 0; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  @media (min-width: 520px) { .post { border-radius: 8px; overflow: hidden; } }
  .head { display: flex; align-items: center; gap: 8px; padding: 12px 16px 0; }
  .av { width: 40px; height: 40px; border-radius: 50%; background: #ccd0d5 center/cover no-repeat; flex: none; }
  .who { flex: 1; min-width: 0; }
  .name { height: 12px; width: 120px; border-radius: 6px; background: #d8dadf; margin: 3px 0 7px; }
  .meta { font-size: 13px; color: #65676b; display: flex; align-items: center; gap: 4px; }
  .meta svg { width: 12px; height: 12px; fill: #65676b; }
  .dots { color: #65676b; font-size: 20px; letter-spacing: 1px; padding: 0 4px; }
  .text { padding: 4px 16px 12px; white-space: pre-wrap; }
  .media { background: #000; }
  .media video { display: block; width: 100%; aspect-ratio: 9 / 16; max-height: 80vh; background: #000; object-fit: contain; }
  .counts { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; color: #65676b; font-size: 13px; }
  #cs { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .reacts { display: flex; align-items: center; }
  .reacts span { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; display: grid; place-items: center; margin-right: -4px; }
  .reacts svg { width: 10px; height: 10px; fill: #fff; }
  .reacts b { font-weight: 400; margin-left: 10px; }
  .like-b { background: linear-gradient(#18afff, #0062df); }
  .love-b { background: linear-gradient(#ff6680, #e61739); }
  .actions { display: flex; margin: 0 12px; border-top: 1px solid #ced0d4; padding: 4px 0; }
  .actions div { flex: 1; min-width: 0; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 0; color: #65676b; font-weight: 600; font-size: 14px; border-radius: 4px; }
  .actions svg { width: 18px; height: 18px; fill: none; stroke: #65676b; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .ghost { filter: blur(3px); opacity: .55; pointer-events: none; }
  .ghost .line { height: 10px; border-radius: 5px; background: #d8dadf; margin: 8px 16px; }
  .ghost .img { height: 140px; background: linear-gradient(135deg, #c9d6e3, #e7d9c9); }
  .ghost.cut-top { margin-top: -120px; }
</style>
</head>
